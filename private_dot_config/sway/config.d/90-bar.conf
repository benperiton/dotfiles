# Intentionally shadows /usr/share/sway/config.d/90-bar.conf (Fedora's stock
#   bar { swaybar_command waybar }
# ) via the layered-include basename override, so it does NOT spawn a second
# waybar. We start waybar ourselves with `exec waybar` in ../config, which
# renders the multi-bar (top + bottom) array from ~/.config/waybar/config.jsonc
# correctly and binds surfaces to outputs cleanly.
#
# DO NOT DELETE / DO NOT EMPTY: this file must stay non-empty. chezmoi removes
# empty files (no empty_ attribute), and without this shadow the stock bar block
# spawns a second waybar -> duplicate top+bottom bars.
